[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decor2hl7"
version = "0.1.0"
description = "Transform flat clinical data using ART-DECOR specifications"
readme = "README.md"
requires-python = ">=3.10.8"
license = "MIT"
dependencies = []

[project.scripts]
decor2hl7 = "decor2hl7.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decor2hl7*"]

[tool.setuptools.package-data]
decor2hl7 = ["py.typed"]
