[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decor2hl7"
version = "0.1.0"
description = "Transform flat clinical data using ART-DECOR specifications"
readme = "README.md"
requires-python = ">=3.10.8"
license = "MIT"
dependencies = ["pyodbc>=5.0,<6"]

[project.optional-dependencies]
dev = ["mypy>=2.3,<3"]

[project.scripts]
decor2hl7 = "decor2hl7.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decor2hl7*"]

[tool.setuptools.package-data]
decor2hl7 = [
  "py.typed",
  "locales/*.json",
  "retrieval/*.json",
  "retrieval/external/*.xml",
  "validation/*.java",
]

[tool.mypy]
strict = true
